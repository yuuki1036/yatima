name: _probe-ua

# 一時的な調査用ワークフロー（YAT-68 / 対処案 B）。PR を出す前に削除する。
# 第2弾: UA は無関係と判明したので、403 ボディの中身で発行元を特定する。
on:
  push:
    branches: ["fix/YAT-68-*"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: dump 403 body
        run: |
          node -e '
          (async () => {
            const url = "https://importai.substack.com/feed";
            const r = await fetch(url, { redirect: "follow", signal: AbortSignal.timeout(15000) });
            console.log("HTTP " + r.status);
            console.log("--- headers ---");
            for (const [k, v] of r.headers) console.log("  " + k + ": " + v);
            const body = await r.text();
            console.log("--- body (text) ---");
            console.log(body.replace(/<script[\s\S]*?<\/script>/g, "")
                            .replace(/<style[\s\S]*?<\/style>/g, "")
                            .replace(/<[^>]+>/g, " ")
                            .replace(/\s+/g, " ").trim().slice(0, 900));
          })();
          '
