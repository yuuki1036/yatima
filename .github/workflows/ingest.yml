name: ingest

# RSS 取得 cron。毎時実行 + 手動実行。
# Supabase 無料枠の「7日無活動で pause」も毎時アクセスで自然回避できる。
on:
  schedule:
    - cron: "0 * * * *" # 毎時 0 分（UTC）
  workflow_dispatch: {} # Actions タブから手動実行

# 同時に走らないように直列化
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    # 失敗時に Issue を立てるため（下の alert-on-failure）。既定の read-only では作れない。
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest
        # job の timeout 超過は GitHub 側で cancel 扱いになり if: failure() を素通りする
        # （learn.yml と同じ理由）。ステップ側に timeout を置いて failure に倒し、
        # 下の alert-on-failure が拾えるようにする。job の timeout はその外側の保険。
        timeout-minutes: 8
        env:
          # GitHub リポジトリの Settings > Secrets and variables > Actions に登録する
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}

      # 失敗を Issue に昇格させる（YAT-74）。検知が動いていても通知が無いと放置される
      # ——実際 2026-08-26〜09-06 の 11 日間、全 run が赤のまま誰も見なかった。
      - name: 失敗を Issue にする
        if: failure()
        uses: ./.github/actions/alert-on-failure
        with:
          job: ingest
          token: ${{ secrets.GITHUB_TOKEN }}
