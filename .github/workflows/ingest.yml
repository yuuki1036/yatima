name: ingest

# RSS 取得 cron。毎時実行 + 手動実行。
# Supabase 無料枠の「7日無活動で pause」も毎時アクセスで自然回避できる。
on:
  schedule:
    # 毎時 17 分（UTC）。0 分は GitHub Actions が最も混雑して発火が遅延・欠落しやすいので
    # ずらした（YAT-77・design doc open 5）。発火率の改善は段階 5 の観測で判定する。
    - cron: "17 * * * *"
  workflow_dispatch: {} # Actions タブから手動実行

# 同時に走らないように直列化
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    # 失敗時に Issue を立てるため（下の alert-on-failure）。既定の read-only では作れない。
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    # embed の壁時計 3 分ぶんを載せて 10 → 15（YAT-77）。job の timeout はステップ timeout の外側の保険。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ingest
        # job の timeout 超過は GitHub 側で cancel 扱いになり if: failure() を素通りする
        # （learn.yml と同じ理由）。ステップ側に timeout を置いて failure に倒し、
        # 下の alert-on-failure が拾えるようにする。job の timeout はその外側の保険。
        # embed の壁時計 3 分ぶんを載せて 8 → 13（YAT-77。job の 15 分の内側に収める）。
        timeout-minutes: 13
        env:
          # GitHub リポジトリの Settings > Secrets and variables > Actions に登録する
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}

      # 失敗を Issue に昇格させる（YAT-74）。検知が動いていても通知が無いと放置される
      # ——実際 2026-08-26〜09-06 の 11 日間、全 run が赤のまま誰も見なかった。
      - name: 失敗を Issue にする
        if: failure()
        uses: ./.github/actions/alert-on-failure
        with:
          job: ingest
          token: ${{ secrets.GITHUB_TOKEN }}
