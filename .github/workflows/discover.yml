name: discover

# 情報源の自動発見 cron。方式①（記事リンク発掘・YAT-16）＋方式②（嗜好ベース提案・YAT-38）で
# 候補フィードを発掘し、検証ゲートを通して feed_candidates に承認待ち登録する。重く低頻度でよい
# 処理なので、ingest（毎時）とは分離して週次で回す。承認は UI（/feeds の DISCOVERED 枠）で人手が行う。
on:
  schedule:
    - cron: "0 3 * * 1" # 毎週月曜 03:00（UTC）
  workflow_dispatch: {} # Actions タブから手動実行

# ingest とは別グループ。発見ジョブ同士だけ直列化する。
concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    # 失敗時に Issue を立てるため（下の alert-on-failure）。既定の read-only では作れない。
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run discover
        # job の timeout 超過は GitHub 側で cancel 扱いになり if: failure() を素通りする
        # （learn.yml と同じ理由）。ステップ側に timeout を置いて failure に倒し、
        # 下の alert-on-failure が拾えるようにする。job の timeout はその外側の保険。
        timeout-minutes: 13
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 方式②（嗜好ベース提案）用。未設定なら方式② は fail-soft でスキップされ、方式① だけ走る。
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # 失敗を Issue に昇格させる（YAT-74）。検知が動いていても通知が無いと放置される
      # ——実際 2026-08-26〜09-06 の 11 日間、全 run が赤のまま誰も見なかった。
      - name: 失敗を Issue にする
        if: failure()
        uses: ./.github/actions/alert-on-failure
        with:
          job: discover
          token: ${{ secrets.GITHUB_TOKEN }}
